[workspace]
members = ["src-tauri", "crates/moontv-local-service", "crates/moontv-storage"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "200.0.0"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["macros"] }
bs58 = "0.5.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
futures = "0.3.31"
html-escape = "0.2.13"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "service", "tokio"] }
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "http2", "json", "rustls-tls", "stream"] }
rfd = "0.17.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = "2.9.1"
tauri-build = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
