[workspace]
members = ["src-tauri", "crates/moontv-local-service"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["macros"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
futures = "0.3.31"
html-escape = "0.2.13"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["brotli", "deflate", "gzip", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = "2.9.1"
tauri-build = "2.5.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
