[package]
name = "moontv-local-service"
version = "0.1.0"
edition = "2024"

[lib]
name = "moontv_local_service"
path = "src/lib.rs"

[[bin]]
name = "lunatv-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.52.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
