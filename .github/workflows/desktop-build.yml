name: Build Desktop App (Internal)

on:
  workflow_dispatch:
    inputs:
      internal_release:
        description: Create an unsigned internal prerelease after all desktop builds pass
        required: false
        type: boolean
        default: false

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            artifact_name: lunatv-desktop-macos-intel
          - name: macOS Apple Silicon
            runner: macos-15
            artifact_name: lunatv-desktop-macos-arm64
          - name: Windows x64
            runner: windows-2022
            artifact_name: lunatv-desktop-windows-x64

    env:
      CI: true
      HUSKY: 0
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: 1
      SITE_BASE: ${{ vars.SITE_BASE || 'https://hkcu.qzz.io' }}
      LUNATV_RELEASE_REPOSITORY: ${{ github.repository }}
      NEXT_PUBLIC_RELEASE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop version
        run: node scripts/sync-desktop-version.mjs

      - name: Sync updater endpoint
        run: pnpm desktop:sync:updater-config

      # Signing and notarization are intentionally left out for now.
      # This workflow produces unsigned artifacts for internal testing.
      - name: Prepare Windows desktop frontend
        if: runner.os == 'Windows'
        run: pnpm desktop:build:frontend

      - name: Prepare Windows desktop sidecar
        if: runner.os == 'Windows'
        run: pnpm desktop:prepare:sidecar:release

      - name: Build desktop bundle
        if: runner.os != 'Windows'
        run: pnpm exec tauri build --ci --config src-tauri/tauri.internal.ci.conf.json

      - name: Build Windows desktop bundle
        if: runner.os == 'Windows'
        run: pnpm exec tauri build --ci --bundles nsis --config src-tauri/tauri.windows.internal.ci.conf.json

      - name: Build Windows portable bundle
        if: runner.os == 'Windows'
        run: node scripts/create-windows-portable-bundle.mjs

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 14

  publish_internal_release:
    name: Publish Internal Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.internal_release }}
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Sync desktop version
        run: node scripts/sync-desktop-version.mjs

      - name: Download build artifacts
        run: gh run download ${{ github.run_id }} --dir .desktop-release/artifacts

      - name: Prepare internal release assets
        id: prepare_release
        run: node scripts/prepare-desktop-internal-release.mjs --artifacts-root .desktop-release/artifacts --output-dir .desktop-release/dist --github-output "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        run: gh release create "${{ steps.prepare_release.outputs.tag }}" .desktop-release/dist/assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${{ steps.prepare_release.outputs.title }}" --notes-file .desktop-release/dist/RELEASE_NOTES.md --prerelease
