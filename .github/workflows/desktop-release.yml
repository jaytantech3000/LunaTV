name: Release Desktop App

on:
  push:
    tags:
      - desktop-v*

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ensure_release:
    name: Ensure GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure_release.outputs.release_id }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Create or update release from tag
        id: ensure_release
        run: node scripts/ensure-desktop-release.mjs --tag "${{ github.ref_name }}" --target "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"

  publish_release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: ensure_release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            runner: macos-15
            args: --target aarch64-apple-darwin
          - name: Windows x64
            runner: windows-2022
            args: --bundles nsis --config src-tauri/tauri.windows.ci.conf.json

    env:
      CI: true
      HUSKY: 0
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: 1
      SITE_BASE: ${{ vars.SITE_BASE || 'https://hkcu.qzz.io' }}
      LUNATV_RELEASE_REPOSITORY: ${{ github.repository }}
      NEXT_PUBLIC_RELEASE_REPOSITORY: ${{ github.repository }}
      APPLE_SIGNING_IDENTITY: '-'

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop version
        run: node scripts/sync-desktop-version.mjs --tag "${{ github.ref_name }}"

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Sync updater endpoint
        run: pnpm desktop:sync:updater-config

      - name: Prepare Windows desktop frontend
        if: runner.os == 'Windows'
        run: pnpm desktop:build:frontend

      - name: Prepare Windows desktop sidecar
        if: runner.os == 'Windows'
        run: pnpm desktop:prepare:sidecar:release

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ needs.ensure_release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: pnpm exec tauri
          args: ${{ matrix.args }}

  normalize_release_assets:
    name: Normalize Release Assets
    runs-on: ubuntu-latest
    needs: publish_release
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Normalize desktop release assets
        run: node scripts/normalize-desktop-release-assets.mjs --tag "${{ github.ref_name }}"

  publish_updater_manifest:
    name: Publish Updater Manifest
    runs-on: ubuntu-latest
    needs: normalize_release_assets
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Publish desktop updater manifest
        run: node scripts/publish-desktop-updater-manifest.mjs --tag "${{ github.ref_name }}"

  publish_download_site:
    name: Publish Download Site
    runs-on: ubuntu-latest
    needs: publish_updater_manifest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOWNLOAD_SITE_COMMIT_MESSAGE: "chore(download-site): publish site for ${{ github.ref_name }}"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Export download site data
        run: node scripts/export-download-site-data.mjs --output .download-site-build/releases.json

      - name: Build download site
        run: node scripts/build-download-site.mjs --data .download-site-build/releases.json --output download-site-dist

      - name: Publish download site branch
        shell: bash
        run: bash scripts/publish-download-site-branch.sh
