name: Build & Push Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 标签'
        required: false
        default: 'latest'
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
      image_name: ${{ steps.resolve.outputs.image_name }}
    steps:
      - name: Resolve build context
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/$owner/lunatv"

          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            docker_tag="$PUSH_TAG"
            echo "docker_tag=$docker_tag" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running Docker image build for pushed tag: $docker_tag"
          else
            docker_tag="${INPUT_TAG:-latest}"
            echo "docker_tag=$docker_tag" >> "$GITHUB_OUTPUT"

            if [[ "$docker_tag" == desktop-* ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping Docker image build for desktop tag: $docker_tag"
            elif [ "${{ github.ref_name }}" = "$DEFAULT_BRANCH" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "Running Docker image build for workflow_dispatch on default branch: $DEFAULT_BRANCH"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping Docker image build for workflow_dispatch on branch '${{ github.ref_name }}'; only '$DEFAULT_BRANCH' is allowed."
            fi
          fi

  build:
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Prepare platform name
        run: |
          echo "PLATFORM_NAME=${{ matrix.platform }}" | sed 's|/|-|g' >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6

        with:
          images: ${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.docker_tag }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.docker_tag }}
          outputs: type=image,name=${{ needs.prepare.outputs.image_name }},name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t ${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.docker_tag }} \
            $(printf '${{ needs.prepare.outputs.image_name }}@sha256:%s ' *)

  cleanup-refresh:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - merge
    if: ${{ always() && needs.prepare.outputs.should_run == 'true' }}
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
          delete_workflow_pattern: ${{ github.workflow }}
