name: Build & Publish Local Service

on:
  push:
    tags:
      - 'local-service-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or update.
        required: true
        default: local-service-latest
      release_name:
        description: GitHub Release display name.
        required: true
        default: LunaTV Local Service
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      alias_release_name: ${{ steps.resolve.outputs.alias_release_name }}
      alias_release_tag: ${{ steps.resolve.outputs.alias_release_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve release metadata
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            release_tag='${{ inputs.release_tag }}'
            release_name='${{ inputs.release_name }}'
            prerelease='${{ inputs.prerelease }}'
          else
            release_tag='${{ github.ref_name }}'
            release_name="LunaTV Local Service (${release_tag})"
            prerelease='true'
          fi

          alias_release_tag=''
          alias_release_name=''
          if [[ "$release_tag" =~ ^local-service-(nova|luna)- ]]; then
            channel="${BASH_REMATCH[1]}"
            alias_release_tag="local-service-${channel}-latest"
            alias_release_name="LunaTV Local Service (${channel} latest)"
          fi

          {
            printf 'alias_release_name=%s\n' "$alias_release_name"
            printf 'alias_release_tag=%s\n' "$alias_release_tag"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'release_name=%s\n' "$release_name"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs:
      - prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run local service tests
        run: cargo test --manifest-path crates/moontv-local-service/Cargo.toml --locked

  build-macos:
    needs:
      - prepare-release
      - verify
    strategy:
      matrix:
        include:
          - asset_name: lunatv-server-mac-arm64
            os: macos-14
            pkg_name: lunatv-local-service-mac-arm64.pkg
            pkg_suffix: mac-arm64
            target: aarch64-apple-darwin
          - asset_name: lunatv-server-mac-x64
            os: macos-15-intel
            pkg_name: lunatv-local-service-mac-x64.pkg
            pkg_suffix: mac-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --manifest-path crates/moontv-local-service/Cargo.toml --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "crates/moontv-local-service/target/${{ matrix.target }}/release/lunatv-server" "dist/${{ matrix.asset_name }}"
          mkdir -p "pkg-root/Library/Application Support/LunaTV Local Service" "pkg-root/Library/LaunchDaemons" pkg-scripts
          install -m 755 "crates/moontv-local-service/target/${{ matrix.target }}/release/lunatv-server" "pkg-root/Library/Application Support/LunaTV Local Service/lunatv-server"
          install -m 644 config.example.json "pkg-root/Library/Application Support/LunaTV Local Service/config.json"
          install -m 644 ".github/local-service/macos/io.qzz.lunatv.local-service.plist" "pkg-root/Library/LaunchDaemons/io.qzz.lunatv.local-service.plist"
          install -m 755 ".github/local-service/macos/postinstall" "pkg-scripts/postinstall"

          pkg_version="$RELEASE_TAG"
          pkg_version="${pkg_version#local-service-}"
          pkg_version="${pkg_version#nova-}"
          pkg_version="${pkg_version#luna-}"
          pkg_version="$(printf '%s' "$pkg_version" | tr -cs '0-9.' '.')"
          pkg_version="${pkg_version#.}"
          pkg_version="${pkg_version%.}"
          if [[ -z "$pkg_version" ]]; then
            pkg_version='1.0.0'
          fi

          pkgbuild \
            --root pkg-root \
            --identifier "io.qzz.lunatv.local-service.${{ matrix.pkg_suffix }}" \
            --install-location / \
            --scripts pkg-scripts \
            --version "$pkg_version" \
            "dist/${{ matrix.pkg_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-service-${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs:
      - prepare-release
      - verify
    strategy:
      matrix:
        include:
          - asset_name: lunatv-server-linux-x64
            deb_arch: amd64
            deb_name: lunatv-local-service-linux-x64.deb
            target: x86_64-unknown-linux-musl
          - asset_name: lunatv-server-linux-arm64
            deb_arch: arm64
            deb_name: lunatv-local-service-linux-arm64.deb
            target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build binary
        run: cross build --locked --release --manifest-path crates/moontv-local-service/Cargo.toml --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "crates/moontv-local-service/target/${{ matrix.target }}/release/lunatv-server" "dist/${{ matrix.asset_name }}"

          pkg_version="$RELEASE_TAG"
          pkg_version="${pkg_version#local-service-}"
          pkg_version="${pkg_version#nova-}"
          pkg_version="${pkg_version#luna-}"
          pkg_version="$(printf '%s' "$pkg_version" | tr -cs '0-9.' '.')"
          pkg_version="${pkg_version#.}"
          pkg_version="${pkg_version%.}"
          if [[ -z "$pkg_version" ]]; then
            pkg_version='1.0.0'
          fi

          deb_root="deb-root"
          rm -rf "$deb_root"
          mkdir -p \
            "$deb_root/DEBIAN" \
            "$deb_root/etc/lunatv-local-service" \
            "$deb_root/lib/systemd/system" \
            "$deb_root/opt/lunatv-local-service/bin" \
            "$deb_root/var/lib/lunatv-local-service"

          install -m 755 "crates/moontv-local-service/target/${{ matrix.target }}/release/lunatv-server" "$deb_root/opt/lunatv-local-service/bin/lunatv-server"
          install -m 644 config.example.json "$deb_root/etc/lunatv-local-service/config.json"
          install -m 644 ".github/local-service/linux/lunatv-local-service.service" "$deb_root/lib/systemd/system/lunatv-local-service.service"
          install -m 755 ".github/local-service/linux/postinst" "$deb_root/DEBIAN/postinst"
          install -m 755 ".github/local-service/linux/prerm" "$deb_root/DEBIAN/prerm"
          install -m 755 ".github/local-service/linux/postrm" "$deb_root/DEBIAN/postrm"

          printf '%s\n' \
            'Package: lunatv-local-service' \
            "Version: $pkg_version" \
            'Section: net' \
            'Priority: optional' \
            'Architecture: ${{ matrix.deb_arch }}' \
            'Maintainer: LunaTV' \
            'Description: LunaTV local acceleration service' \
            ' Local HTTP proxy service for LunaTV web deployments.' \
            > "$deb_root/DEBIAN/control"

          printf '%s\n' \
            '/etc/lunatv-local-service/config.json' \
            > "$deb_root/DEBIAN/conffiles"

          dpkg-deb --build --root-owner-group "$deb_root" "dist/${{ matrix.deb_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-service-${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs:
      - verify
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build binary
        run: cargo build --locked --release --manifest-path crates/moontv-local-service/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip.install -y

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, installer-build, installer-payload | Out-Null

          Copy-Item "crates/moontv-local-service/target/x86_64-pc-windows-msvc/release/lunatv-server.exe" "dist/lunatv-server-win-x64.exe"
          Copy-Item "crates/moontv-local-service/target/x86_64-pc-windows-msvc/release/lunatv-server.exe" "installer-payload/lunatv-server.exe"
          Copy-Item "config.example.json" "installer-payload/config.json"
          Copy-Item ".github/local-service/windows/install-local-service.cmd" "installer-payload/install-local-service.cmd"
          Copy-Item ".github/local-service/windows/run-local-service.vbs" "installer-payload/run-local-service.vbs"

          $sevenZipExe = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          $sevenZipSfx = Join-Path $env:ProgramFiles "7-Zip\7z.sfx"
          if (-not (Test-Path $sevenZipExe) -or -not (Test-Path $sevenZipSfx)) {
            throw "7-Zip SFX components are unavailable on the runner."
          }

          $archivePath = Join-Path (Resolve-Path "installer-build").Path "lunatv-local-service-win-x64.7z"
          $configPath = Join-Path (Resolve-Path "installer-build").Path "lunatv-local-service-win-x64.txt"
          $targetPath = Join-Path (Resolve-Path "dist").Path "lunatv-local-service-win-x64.exe"

          & $sevenZipExe a -t7z $archivePath ".\installer-payload\*" | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed to create the Windows installer payload."
          }

          @'
          ;!@Install@!UTF-8!
          Title="LunaTV Local Service"
          RunProgram="install-local-service.cmd"
          GUIMode="1"
          ;!@InstallEnd@!
          '@ | Set-Content -Path $configPath -Encoding UTF8

          & cmd.exe /c "copy /b /y ""$sevenZipSfx""+""$configPath""+""$archivePath"" ""$targetPath"" >nul"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $targetPath)) {
            throw "Failed to assemble the Windows self-extracting installer."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-service-windows-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - prepare-release
      - build-macos
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    env:
      ALIAS_RELEASE_NAME: ${{ needs.prepare-release.outputs.alias_release_name }}
      ALIAS_RELEASE_TAG: ${{ needs.prepare-release.outputs.alias_release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_NAME: ${{ needs.prepare-release.outputs.release_name }}
      RELEASE_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: local-service-*
          merge-multiple: true

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          name="$RELEASE_NAME"
          flags=()
          if [[ "$RELEASE_PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$name" "${flags[@]}"
          else
            gh release create "$tag" --title "$name" --notes "Automated LunaTV local service build." "${flags[@]}"
          fi

          if [[ -n "$ALIAS_RELEASE_TAG" ]]; then
            if gh release view "$ALIAS_RELEASE_TAG" >/dev/null 2>&1; then
              gh release edit "$ALIAS_RELEASE_TAG" --title "$ALIAS_RELEASE_NAME" "${flags[@]}"
            else
              gh release create "$ALIAS_RELEASE_TAG" --title "$ALIAS_RELEASE_NAME" --notes "Automated LunaTV local service branch alias." "${flags[@]}"
            fi
          fi

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ -n "$ALIAS_RELEASE_TAG" ]]; then
            gh release upload "$ALIAS_RELEASE_TAG" dist/* --clobber
          fi
